name: t128n's personal design system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and check generated CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Verify generated CSS is committed
        run: bun run check
