version = 1

SPDX-PackageName = "@t128n/ui"
SPDX-PackageSupplier = "Person: t128n"
SPDX-PackageDownloadLocation = "https://github.com/t128n/design"

# Files that cannot carry an SPDX header, plus generated files that a tool
# rewrites. Everything else in the repository carries its own header.
[[annotations]]
path = [
  "package.json",
  "packages/ui/package.json",
  "packages/ui/tsconfig.json",
  "packages/ui/fixtures/consumer/tsconfig.json",
  ".changeset/config.json",
  "bun.lock",
  "packages/ui/CHANGELOG.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 t128n"
SPDX-License-Identifier = "MIT"
