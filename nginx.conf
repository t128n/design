server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The design system preview is unlisted: keep the main domain and every PR
    # preview domain out of search results. nginx repeats this header in
    # locations that set their own add_header directives, because add_header
    # is not inherited once a location defines one.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Container-level liveness endpoint used by the Docker HEALTHCHECK and
    # Coolify's HTTP health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Vite content-hashes everything under /assets/, so these files never change
    # for a given build and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts and images copied to the build root (not hashed).
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Entry documents always point at the current build; never cache them.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /iframe.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Storybook routes through query strings (?path=/story/...), so serving the
    # manager shell for unknown paths is safe and keeps deep links working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
